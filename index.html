<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/index.css">
    <title>QuickList</title>
</head>
<body>
    <header>
        <img src="assets/logo.svg" alt="Logo QuickList">
    </header>

    <main>
        <a href="#">
            <img src="assets/icons/arrow-left-02-stroke-rounded.svg" alt="">
            Voltar
        </a>

        <h1>Compras da Semana</h1>

        <form>
            <input 
            type="text" 
            placeholder="Adicione um novo item"
            aria-label="Novo item">

            <button type="submit" id="add-item">Adicionar item</button>
        </form>

        <ul>
            <li>
                <input type="checkbox" id="bread">
                <label for="bread">Pão de Forma</label>
                <button type="button" aria-label="Remover item">
                    <img src="assets/icons/Frame-3.svg" alt="">
                </button>
            </li>
        
            <li>
                <input type="checkbox" id="coffee">
                <label for="coffe">Café Preto</label>
                <button type="button" aria-label="Remover item">
                    <img src="assets/icons/Frame-3.svg" alt="">
                </button>
            </li>

            <li>
                <input type="checkbox" id="juice-orange">
                <label for="juice-orange">Suco de Laranja</label>
                <button type="button" aria-label="Remover item">
                    <img src="assets/icons/Frame-3.svg" alt="">
                </button>
            </li>

            <li>
                <input type="checkbox" id="cookie">
                <label for="cookie">Biscoito</label>
                <button type="button" aria-label="Remover item">
                    <img src="assets/icons/Frame-3.svg" alt="">
                </button>
            </li>
        </ul>

    </main>
    <script src="scripts.js"></script>
</body>
</html>
